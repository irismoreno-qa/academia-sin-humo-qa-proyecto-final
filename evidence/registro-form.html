<form class="space-y-5" novalidate="">
    <div><label for="name" class="mb-1.5 block text-sm font-medium">Nombre completo</label><input id="name"
            placeholder="Ana García"
            class="w-full rounded-lg border border-input-border bg-background px-4 py-2.5 text-sm transition-colors placeholder:text-muted-foreground focus:border-primary focus:outline-none focus:ring-2 focus:ring-ring/20"
            data-testid="register-name" type="text" value=""></div>
    <div><label for="email" class="mb-1.5 block text-sm font-medium">Email</label><input id="email"
            placeholder="ana@ejemplo.com"
            class="w-full rounded-lg border border-input-border bg-background px-4 py-2.5 text-sm transition-colors placeholder:text-muted-foreground focus:border-primary focus:outline-none focus:ring-2 focus:ring-ring/20"
            data-testid="register-email" type="email" value=""></div>
    <div><label for="password" class="mb-1.5 block text-sm font-medium">Contraseña</label><input id="password"
            placeholder="Mínimo 8 caracteres"
            class="w-full rounded-lg border border-input-border bg-background px-4 py-2.5 text-sm transition-colors placeholder:text-muted-foreground focus:border-primary focus:outline-none focus:ring-2 focus:ring-ring/20"
            data-testid="register-password" type="password" value=""></div>
    <div><label for="age" class="mb-1.5 block text-sm font-medium">Edad</label><input id="age" placeholder="25" min="1"
            max="150"
            class="w-full rounded-lg border border-input-border bg-background px-4 py-2.5 text-sm transition-colors placeholder:text-muted-foreground focus:border-primary focus:outline-none focus:ring-2 focus:ring-ring/20"
            data-testid="register-age" type="number" value=""></div><button type="submit"
        class="w-full rounded-full bg-gradient-to-r from-primary to-primary/70 px-7 py-3 text-sm font-semibold text-primary-foreground shadow-lg transition-all hover:scale-[1.02] hover:opacity-90 disabled:cursor-not-allowed disabled:opacity-50"
        data-testid="register-submit">Crear cuenta</button>
</form>
