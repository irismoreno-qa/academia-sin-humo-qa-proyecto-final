# Suite del proyecto final — Academia sin Humo
#
# Corre 43 tests: 30 E2E de registro, 11 de contrato de API y 1 flujo integrado,
# más el smoke de entorno. El repositorio ya no contiene tests ajenos al proyecto,
# así que el CI cubre el 100% de lo que hay.
#
# Ocho tests de la suite llevan test.fail() contra defectos confirmados contra la
# especificación. No están silenciados: corren, ejecutan sus aserciones, y Playwright
# verifica que efectivamente fallen. El día que el producto se corrija, se pondrán en
# rojo avisando que hay que quitar la anotación.

name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Suite del proyecto
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v6

      - name: Preparar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium

      # La consigna prohíbe silenciar tests o usar esperas por tiempo fijo para
      # forzar un verde. Este paso convierte esa prohibición en algo que el CI
      # hace cumplir, en vez de dejarla como una buena intención en un documento.
      - name: Verificar que no hay tests silenciados
        run: |
          if grep -rn "test\.skip\|\.only(\|waitForTimeout" tests/ pages/; then
            echo "::error::Se encontraron tests silenciados o esperas por tiempo fijo."
            exit 1
          fi
          echo "Sin skip, sin only, sin waitForTimeout."

      # El smoke corre primero y a propósito: si falla, el problema es el entorno y
      # no la suite. Separa el diagnóstico del veredicto.
      - name: Comprobar el entorno
        run: npx playwright test tests/ci/ci-smoke.spec.ts --project=chromium

      - name: Ejecutar la suite del proyecto
        run: npx playwright test tests/e2e tests/api tests/integrado --project=chromium

      # if: !cancelled() para que el reporte suba también cuando la suite falla,
      # que es justo cuando hace falta mirarlo.
      - name: Guardar el reporte de Playwright
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: error
          retention-days: 7
